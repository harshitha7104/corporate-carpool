# Local production-like stack: PostgreSQL + the Green Way image.
#   docker compose up --build      then open http://localhost:4000
# Runs as a labelled demo deployment (on-screen codes, simulated payments,
# fictional seed data). Replace the provider settings for a real pilot.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: greenway
      POSTGRES_USER: greenway
      POSTGRES_PASSWORD: greenway-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenway -d greenway"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://greenway:greenway-local-only@db:5432/greenway
      PUBLIC_APP_URL: http://localhost:4000
      SESSION_SECRET: change-me-local-compose-only-0123456789abcdef
      DEMO_MODE: "true"
      SEED_DEMO: "true"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
