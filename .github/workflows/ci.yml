name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tests start their own embedded PostgreSQL per file.
      - run: npm test
      - name: Production config refuses development shortcuts
        run: |
          set +e
          NODE_ENV=production DATABASE_URL=postgres://x@localhost/x SESSION_SECRET=0123456789abcdef0123456789abcdef PUBLIC_APP_URL=https://example.com node -e "import('./src/config.js')" 2>err.txt
          code=$?
          grep -q "OTP_PROVIDER=dev" err.txt && [ $code -ne 0 ]

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/carpool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/carpool/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: front-end/carpool
      - run: npx playwright install --with-deps chrome
        working-directory: front-end/carpool
      - run: npx playwright test
        working-directory: front-end/carpool
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: front-end/carpool/test-results
