services:
  - type: web
    name: corporate-carpool
    runtime: node
    plan: free
    buildCommand: npm --prefix front-end/carpool ci --include=dev && npm --prefix front-end/carpool run build && npm --prefix backend ci --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: AUTH_SECRET
        sync: false
