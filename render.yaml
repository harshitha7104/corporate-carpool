# Render Blueprint: one web service plus a managed PostgreSQL database.
# As committed, this is a labelled DEMO deployment (DEMO_MODE): sign-in codes
# appear on screen and payments are simulated, so anyone could sign in as any
# number. Before a real pilot, set OTP_PROVIDER=msg91, PAYMENTS_PROVIDER=razorpay
# with their secrets, and remove DEMO_MODE and SEED_DEMO. The site address
# comes from Render (RENDER_EXTERNAL_URL); set PUBLIC_APP_URL for a custom domain.
databases:
  - name: greenway-db
    plan: free
    databaseName: greenway
    user: greenway

services:
  - type: web
    name: green-way
    runtime: node
    plan: free
    buildCommand: npm --prefix front-end/carpool ci --include=dev && npm --prefix front-end/carpool run build && npm --prefix backend ci --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: greenway-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
